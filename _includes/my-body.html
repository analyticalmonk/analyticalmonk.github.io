<script>
// Leaving a post from the opened nav.
//
// The sidebar is collapsed on posts by a CSS rule keyed on #_main's
// layout-post class. hy-push-state closes the drawer the moment you click a
// nav link but only swaps #_main when the new page arrives, so for the length
// of that fetch the drawer is shut while the page still counts as a post - and
// the rule would yank the sidebar off screen, then hand it straight back once
// the destination turned out to have one.
//
// Whether the drawer was open when a navigation began is not written anywhere
// in the DOM, so mark it here and let the rule hold off until the destination
// is known. Then the nav simply closes down into the sidebar, or fades out if
// the next page is another post.
(function () {
  var root = document.documentElement;
  var timer;

  function clear() {
    clearTimeout(timer);
    root.classList.remove('drawer-nav');
  }

  document.addEventListener('click', function (e) {
    if (!e.target.closest) return;
    var a = e.target.closest('#_sidebar a[href]');
    // Anything that leaves the site is a full page load; the class would
    // outlive the navigation and keep the sidebar on posts for good.
    if (!a || a.origin !== location.origin) return;
    root.classList.add('drawer-nav');
    clearTimeout(timer);
    timer = setTimeout(clear, 3000);
  }, true);

  ['hy-push-state-after', 'hy-push-state-networkerror'].forEach(function (name) {
    document.addEventListener(name, clear, true);
  });
})();
</script>
