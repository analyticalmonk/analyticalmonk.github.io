<script>
// Leaving a post from the opened nav.
//
// The sidebar is collapsed on posts by a CSS rule keyed on #_main's
// layout-post class. hy-push-state closes the drawer the moment you click a
// nav link but only swaps #_main when the new page arrives, so for the length
// of that fetch the drawer is shut while the page still counts as a post - and
// the rule would yank the sidebar off screen, then hand it straight back once
// the destination turned out to have one.
//
// Whether the drawer was open when a navigation began is the one fact the DOM
// does not record, so mark it here and let the rule hold off until the
// destination is known. Then the nav closes down into the sidebar, or fades out
// if the next page is another post.
(function () {
  var root = document.documentElement;

  function clear() {
    root.classList.remove('drawer-nav');
  }

  // These fire without `bubbles`, so they are only observable on the capture
  // phase. `start` runs before the theme closes the drawer, so _drawer still
  // reports whether the nav was open when the click landed - and it fires only
  // for navigations hy-push-state actually takes, so every one of them ends in
  // one of the events below.
  document.addEventListener('hy-push-state-start', function () {
    if (window._drawer && window._drawer.opened) root.classList.add('drawer-nav');
  }, true);

  ['hy-push-state-after', 'hy-push-state-error', 'hy-push-state-networkerror']
    .forEach(function (name) { document.addEventListener(name, clear, true); });
})();
</script>
